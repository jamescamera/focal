<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOCAL — put a lens on it</title>
<style>
  :root{
    --ink:#0B0E11;
    --glass:#141A20;
    --etch:#28323C;
    --paper:#D6DBD8;
    --dim:#7C8894;
    --coat-a:#D8489B;
    --coat-b:#3FD0D8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ink);
    color:var(--paper);
    font:400 13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  .wrap{display:flex;flex-direction:column;min-height:100%}

  header{
    display:flex;align-items:baseline;gap:12px;
    padding:14px 16px 10px;border-bottom:1px solid var(--etch);
  }
  .mark{
    font-size:15px;letter-spacing:.42em;text-transform:uppercase;font-weight:600;
    background:linear-gradient(92deg,var(--coat-a),var(--coat-b));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

  .stage{
    position:relative;background:
      repeating-conic-gradient(#0f1418 0% 25%, #121820 0% 50%) 50%/16px 16px;
    display:flex;align-items:center;justify-content:center;
    height:56vh;padding:14px;
  }
  /* Size is driven from JS so the drawing buffer matches the pixels on screen. */
  canvas{display:block;cursor:crosshair;
    box-shadow:0 0 0 1px var(--etch),0 18px 50px -20px #000}
  #drop{
    position:absolute;inset:14px;border:1px dashed var(--etch);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;text-align:center;padding:20px;
  }
  #drop.hide{display:none}
  #drop p{margin:0;color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

  .btn{
    appearance:none;background:transparent;color:var(--paper);
    border:1px solid var(--etch);padding:9px 14px;
    font:inherit;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    cursor:pointer;
  }
  .btn:hover{border-color:var(--coat-b)}
  .btn:focus-visible{outline:2px solid var(--coat-b);outline-offset:2px}
  .btn[disabled]{opacity:.35;cursor:not-allowed}

  .panel{border-top:1px solid var(--etch);padding:6px 16px 40px}
  .group{padding:14px 0;border-bottom:1px solid #1b232b}
  .group:last-child{border-bottom:0}
  .glabel{
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);
    display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  }

  .seg{display:flex;gap:0;border:1px solid var(--etch)}
  .seg button{
    flex:1;background:transparent;border:0;border-right:1px solid var(--etch);
    color:var(--dim);font:inherit;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;padding:10px 4px;cursor:pointer;
  }
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{color:var(--ink);background:var(--paper)}
  .seg button:focus-visible{outline:2px solid var(--coat-b);outline-offset:-2px}

  .row{display:grid;grid-template-columns:88px 1fr 46px;align-items:center;gap:10px;margin:9px 0}
  .row label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
  .row output{font-size:11px;text-align:right;color:var(--paper)}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:1px;background:var(--etch)
  }
  input[type=range]::-moz-range-track{height:1px;background:var(--etch)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:2px;height:16px;margin-top:-8px;border-radius:0;
    background:linear-gradient(180deg,var(--coat-a),var(--coat-b));
  }
  input[type=range]::-moz-range-thumb{
    width:2px;height:16px;border:0;border-radius:0;
    background:linear-gradient(180deg,var(--coat-a),var(--coat-b));
  }
  input[type=range]:focus-visible{outline:1px solid var(--coat-b);outline-offset:4px}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  #status{margin-top:10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);min-height:14px}
  #status.warn{color:var(--coat-a)}
  #meta{margin-top:14px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);min-height:14px}
  input[type=file]{display:none}

  @media(min-width:900px){
    .wrap{flex-direction:row;height:100vh}
    .left{flex:1;display:flex;flex-direction:column;min-width:0}
    .stage{flex:1;height:auto;min-height:0}
    .panel{width:340px;border-top:0;border-left:1px solid var(--etch);overflow-y:auto;padding-bottom:24px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <header>
      <span class="mark">Focal</span>
      <span class="sub">optical bench for flat pictures</span>
    </header>
    <div class="stage" id="stage">
      <canvas id="gl"></canvas>
      <div id="drop">
        <p>Drop an image, or</p>
        <button class="btn" id="pick">Choose a picture</button>
        <p style="max-width:34ch;text-transform:none;letter-spacing:.04em">Nothing is uploaded anywhere. It all runs on this device.</p>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="group">
      <div class="glabel"><span>Where the depth comes from</span></div>
      <div class="seg" id="mode">
        <button data-mode="radial" aria-pressed="true">Subject</button>
        <button data-mode="ground" aria-pressed="false">Ground</button>
        <button data-mode="auto" aria-pressed="false">Auto</button>
      </div>
      <div id="status">Tap the picture to set what stays sharp.</div>
    </div>

    <div class="group">
      <div class="glabel"><span>Focus</span></div>
      <div class="row"><label for="focus">Plane</label><input type="range" id="focus" min="0" max="1" step="0.005" value="1"><output for="focus">1.00</output></div>
      <div class="row"><label for="spread">Spread</label><input type="range" id="spread" min="0" max="1" step="0.01" value="0.42"><output for="spread">0.42</output></div>
      <div class="row"><label for="aperture">Aperture</label><input type="range" id="aperture" min="0" max="60" step="1" value="22"><output for="aperture">22</output></div>
      <div class="row"><label for="edge">Edge soft</label><input type="range" id="edge" min="0" max="1" step="0.01" value="0"><output for="edge">0.00</output></div>
    </div>

    <div class="group">
      <div class="glabel"><span>Bokeh</span></div>
      <div class="row"><label for="hthresh">Highlights</label><input type="range" id="hthresh" min="0.3" max="1" step="0.01" value="0.72"><output for="hthresh">0.72</output></div>
      <div class="row"><label for="hboost">Bloom</label><input type="range" id="hboost" min="0" max="8" step="0.1" value="3.2"><output for="hboost">3.2</output></div>
    </div>

    <div class="group">
      <div class="glabel"><span>Glass and sensor</span></div>
      <div class="row"><label for="ca">Fringing</label><input type="range" id="ca" min="0" max="3" step="0.05" value="0"><output for="ca">0.00</output></div>
      <div class="row"><label for="dist">Barrel</label><input type="range" id="dist" min="-0.15" max="0.15" step="0.005" value="0"><output for="dist">0.00</output></div>
      <div class="row"><label for="vig">Vignette</label><input type="range" id="vig" min="0" max="1" step="0.01" value="0.16"><output for="vig">0.16</output></div>
      <div class="row"><label for="grain">Grain</label><input type="range" id="grain" min="0" max="0.2" step="0.002" value="0.008"><output for="grain">0.008</output></div>
      <div class="row"><label for="lift">Lifted blacks</label><input type="range" id="lift" min="0" max="0.3" step="0.005" value="0"><output for="lift">0.00</output></div>
    </div>

    <div class="actions">
      <button class="btn" id="showdepth" aria-pressed="false">Show depth</button>
      <button class="btn" id="reset">Reset</button>
      <button class="btn" id="save" disabled>Save PNG</button>
      <button class="btn" id="pick2">Change picture</button>
    </div>
    <div id="meta"></div>
  </div>
</div>

<input type="file" id="file" accept="image/*">

<script>
/* ------------------------------------------------------------------ *
 * FOCAL — depth-driven disc bokeh + lens/sensor imperfections, WebGL2 *
 *                                                                    *
 * The picture is kept at full resolution end to end. The preview is   *
 * rendered at the size it is actually shown at, so the browser never  *
 * has to squash a huge drawing buffer down to the screen, and Save    *
 * re-renders the whole thing at native size.                          *
 * ------------------------------------------------------------------ */

const $ = s => document.querySelector(s);
const canvas = $('#gl');
const stage  = $('#stage');
const statusEl = $('#status');
const metaEl = $('#meta');

const gl = canvas.getContext('webgl2', {
  preserveDrawingBuffer:true, antialias:false, premultipliedAlpha:false, alpha:false
});

if(!gl){ statusEl.textContent = 'This browser has no WebGL2. Try Chrome, Safari 15+, or Firefox.'; statusEl.className='warn'; }

let MAX_SIDE = 3400;        // native pixels kept for the picture itself
const DEPTH_MAX = 1024;     // depth is low frequency; no need to hold it at full size
const MAX_DPR = 2;

let img = null;             // decoded source
let imgCanvas = null;       // source pixels at working resolution
let depthCanvas = null;     // greyscale depth
let autoDepthCanvas = null; // cached AI depth for the current picture
let mode = 'radial';
let focusPt = {x:0.5, y:0.5};
let showDepth = false;
let hdr = false;            // float render target available

/* ---------------------------- shaders ---------------------------- */

const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

/* Shared circle-of-confusion model. uMaxCoC is in the pixels of whichever
   pass is running, so the same code works at full and at half resolution. */
const COC = `
uniform sampler2D uDepth;
uniform float uFocus, uSpread, uMaxCoC, uEdge;
float depthAt(vec2 uv){ return texture(uDepth, uv).r; }
float cocAt(vec2 uv){
  float d = depthAt(uv);
  float s = max(uSpread, 0.001);
  float c = abs(d - uFocus) / s;
  vec2 p = (uv - 0.5) * 2.0;
  c += pow(clamp(length(p) / 1.4142, 0.0, 1.0), 2.2) * uEdge * 2.0;
  return clamp(c, 0.0, 1.0) * uMaxCoC;
}`;

/* Pass 1 — gather the defocus disc. Runs in linear light (the source is an
   sRGB texture, so the sampler hands us linear values) and writes to a float
   target, so blown highlights keep their energy instead of clipping at 1.0.
   Alpha carries "how much nearer, blurred stuff spills onto this pixel",
   which lets the composite keep foreground bokeh over sharp background. */
const FS_BOKEH = `#version 300 es
precision highp float;
uniform sampler2D uImg;
uniform vec2 uRes;
uniform float uHiThresh, uHiBoost, uPx, uLod;
uniform int uSamples;
in vec2 vUv; out vec4 outColor;
${COC}

const int MAXN = 256;

void main(){
  vec3 base = textureLod(uImg, vUv, uLod).rgb;
  if(uMaxCoC < 0.5){ outColor = vec4(base, 0.0); return; }

  float centreCoC = cocAt(vUv);
  float centreD   = depthAt(vUv);

  vec3 sum = vec3(0.0);
  float wsum = 0.0, fgsum = 0.0;
  float golden = 2.399963229728653;
  float jitter = fract(sin(dot(vUv, vec2(12.9898,78.233))) * 43758.5453) * 6.2831;
  float n = float(uSamples);

  for(int i = 0; i < MAXN; i++){
    if(i >= uSamples) break;
    float fi = float(i) + 0.5;
    float r  = sqrt(fi / n);
    float a  = fi * golden + jitter;
    vec2 off = vec2(cos(a), sin(a)) * r * uMaxCoC;
    vec2 suv = clamp(vUv + off / uRes, vec2(0.0), vec2(1.0));

    float sCoC = cocAt(suv);
    float dist = length(off);

    // a sample only lands here if its own circle of confusion reaches this pixel
    float w = clamp(sCoC - dist + 1.0, 0.0, 1.0);

    // stop background from smearing over something that is in focus
    float sD = depthAt(suv);
    if(sD < centreD - 0.02){
      w *= clamp(centreCoC - dist + 1.0, 0.0, 1.0);
    }
    if(w <= 0.0) continue;

    vec3 c = textureLod(uImg, suv, uLod).rgb;
    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    // highlights only bloom where there is actually defocus to bloom into
    float bloomable = clamp(sCoC / max(3.0 * uPx, 0.001), 0.0, 1.0);
    c *= 1.0 + max(0.0, lum - uHiThresh) * uHiBoost * bloomable;

    sum += c * w;
    wsum += w;
    fgsum += w * ((sD > centreD + 0.02 && sCoC > 1.5 * uPx) ? 1.0 : 0.0);
  }

  vec3 col = wsum > 0.0 ? sum / wsum : base;
  float fg = wsum > 0.0 ? clamp(fgsum / wsum * 1.6, 0.0, 1.0) : 0.0;
  outColor = vec4(col, fg);
}`;

/* Pass 2 — composite sharp against blurred, then glass and sensor.
   Anything whose circle of confusion is under a pixel comes straight from the
   source texture untouched, so in-focus detail survives the round trip. */
const FS_FINISH = `#version 300 es
precision highp float;
uniform sampler2D uImg, uBlur;
uniform vec2 uRes;
uniform float uCA, uDist, uVig, uGrain, uLift, uSeed;
in vec2 vUv; out vec4 outColor;
${COC}

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

vec3 resolve(vec2 uv){
  vec4 b = texture(uBlur, uv);
  float m = max(smoothstep(0.6, 1.6, cocAt(uv)), b.a);
  if(m <= 0.0) return texture(uImg, uv).rgb;
  return mix(texture(uImg, uv).rgb, b.rgb, m);
}

vec3 encodeSRGB(vec3 c){
  c = clamp(c, 0.0, 1.0);
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(vec3(0.0031308), c));
}

void main(){
  vec2 p = vUv - 0.5;
  vec2 duv = vUv + p * dot(p, p) * uDist;

  vec3 col;
  if(uCA > 0.001){
    float k = uCA * 0.0035;
    col = vec3(
      resolve(0.5 + (duv - 0.5) * (1.0 + k)).r,
      resolve(duv).g,
      resolve(0.5 + (duv - 0.5) * (1.0 - k)).b);
  }else{
    col = resolve(duv);
  }

  float v = 1.0 - uVig * pow(clamp(length(p) * 1.42, 0.0, 1.0), 2.2);
  col *= v;

  col = encodeSRGB(col);
  col = col * (1.0 - uLift) + uLift * vec3(0.030, 0.034, 0.045);

  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col += (hash(vUv * uRes + uSeed) - 0.5) * uGrain * (1.0 - lum * 0.65);

  // sub-LSB dither: kills the banding that smooth bokeh and vignette
  // otherwise show once they are quantised to 8 bits
  col += (hash(vUv * uRes + uSeed + 91.7) - 0.5) / 255.0;

  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

const FS_DEPTH = `#version 300 es
precision highp float;
uniform sampler2D uDepth;
in vec2 vUv; out vec4 outColor;
void main(){ outColor = vec4(vec3(texture(uDepth, vUv).r), 1.0); }`;

/* ---------------------------- gl plumbing ---------------------------- */

let progBokeh, progFinish, progDepth, vao, fbo, texBlur, texImg, texDepth;
let blurW = 0, blurH = 0;
let viewW = 0, viewH = 0;                 // resolution currently held in texImg
let viewCache = null, viewCacheW = 0, viewCacheH = 0;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function link(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function makeTex(min){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, min || gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return t;
}

function initGL(){
  hdr = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
  MAX_SIDE = Math.min(MAX_SIDE, gl.getParameter(gl.MAX_TEXTURE_SIZE));

  progBokeh  = link(VS, FS_BOKEH);
  progFinish = link(VS, FS_FINISH);
  progDepth  = link(VS, FS_DEPTH);

  vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // the source is mipmapped so that reduced-size passes prefilter instead of
  // point-sampling a much bigger picture, which is what made the preview crawl
  texImg   = makeTex(gl.LINEAR_MIPMAP_LINEAR);
  texDepth = makeTex();
  texBlur  = makeTex();
  fbo = gl.createFramebuffer();
}
if(gl) initGL();

function u(p, n){ return gl.getUniformLocation(p, n); }

// Feed the shaders a source that is already at the resolution being drawn.
// Letting the GPU minify a 3400px texture with trilinear mips costs real
// detail, and letting the compositor minify the drawing buffer costs more
// than that — it aliases. A proper box-filtered resample beats both.
function useSourceAt(w, h){
  if(!imgCanvas) return;
  const full = (w >= imgCanvas.width || h >= imgCanvas.height);
  const tw = full ? imgCanvas.width  : Math.max(1, w);
  const th = full ? imgCanvas.height : Math.max(1, h);
  if(viewW === tw && viewH === th) return;

  let c;
  if(full) c = imgCanvas;
  else if(viewCache && viewCacheW === tw && viewCacheH === th) c = viewCache;
  else { c = fitToCanvas(imgCanvas, tw, th); viewCache = c; viewCacheW = tw; viewCacheH = th; }

  gl.bindTexture(gl.TEXTURE_2D, texImg);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  // sRGB internal format: the sampler decodes to linear for us, so filtering
  // and the whole blur happen in light rather than in gamma-coded values
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.generateMipmap(gl.TEXTURE_2D);
  viewW = tw; viewH = th;
}

function ensureBlurTarget(w, h){
  if(w === blurW && h === blurH) return;
  blurW = w; blurH = h;
  gl.bindTexture(gl.TEXTURE_2D, texBlur);
  if(hdr) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else    gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
}

/* ---------------------------- depth maps ---------------------------- */

function depthDims(){
  const w = imgCanvas.width, h = imgCanvas.height;
  const s = Math.min(1, DEPTH_MAX / Math.max(w, h));
  return [Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s))];
}

function ensureDepthCanvas(w, h){
  if(!depthCanvas) depthCanvas = document.createElement('canvas');
  if(depthCanvas.width !== w || depthCanvas.height !== h){
    depthCanvas.width = w; depthCanvas.height = h;
  }
  const ctx = depthCanvas.getContext('2d', {willReadFrequently:true});
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  return ctx;
}

// Subject: a flat, genuinely sharp core around the focus point, then falling
// off outwards. Without the flat part nothing in the frame is ever fully sharp,
// which reads as the whole picture having gone soft.
function buildRadialDepth(){
  const [w, h] = depthDims();
  const ctx = ensureDepthCanvas(w, h);
  const cx = focusPt.x * w, cy = focusPt.y * h;
  const rad = Math.hypot(w, h) * 0.62;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
  g.addColorStop(0, '#fff');
  g.addColorStop(0.22, '#fff');
  g.addColorStop(0.45, '#d8d8d8');
  g.addColorStop(1, '#000');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}

// Ground: a receding plane. Near the bottom of the frame is close, the top is far.
function buildGroundDepth(){
  const [w, h] = depthDims();
  const ctx = ensureDepthCanvas(w, h);
  const g = ctx.createLinearGradient(0, h, 0, 0);
  g.addColorStop(0, '#fff');
  g.addColorStop(1, '#000');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}

function useAutoDepth(){
  const [w, h] = depthDims();
  const ctx = ensureDepthCanvas(w, h);
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(autoDepthCanvas, 0, 0, w, h);
}

function rebuildDepth(){
  if(!imgCanvas || !gl) return;
  if(mode === 'ground') buildGroundDepth();
  else if(mode === 'auto' && autoDepthCanvas) useAutoDepth();
  else buildRadialDepth();

  gl.bindTexture(gl.TEXTURE_2D, texDepth);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, depthCanvas);
}

function depthValueAt(nx, ny){
  if(!depthCanvas) return 1;
  const ctx = depthCanvas.getContext('2d', {willReadFrequently:true});
  const x = Math.max(0, Math.min(depthCanvas.width - 1, Math.round(nx * depthCanvas.width)));
  const y = Math.max(0, Math.min(depthCanvas.height - 1, Math.round(ny * depthCanvas.height)));
  return ctx.getImageData(x, y, 1, 1).data[0] / 255;
}

/* ---------------------------- render ---------------------------- */

let raf = 0, hqTimer = 0;

function render(){
  if(!imgCanvas || !gl) return;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => drawScene(canvas.width, canvas.height, false));
  // settle on the full sample count once the slider stops moving
  clearTimeout(hqTimer);
  hqTimer = setTimeout(() => drawScene(canvas.width, canvas.height, true), 140);
}

function val(id){ return parseFloat($('#' + id).value); }

function drawScene(w, h, quality){
  if(!imgCanvas || !gl || w < 1 || h < 1) return;
  gl.bindVertexArray(vao);
  useSourceAt(w, h);

  if(showDepth){
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, w, h);
    gl.useProgram(progDepth);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texDepth);
    gl.uniform1i(u(progDepth, 'uDepth'), 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    return;
  }

  const ref    = Math.max(w, h) / 1600;        // output pixels per "reference" pixel
  const maxCoC = val('aperture') * ref;        // disc radius in output pixels
  const scale  = maxCoC > 6 ? 0.5 : 1.0;       // big blur is low frequency — gather it at half res
  const bw = Math.max(1, Math.round(w * scale));
  const bh = Math.max(1, Math.round(h * scale));
  const cocPass = maxCoC * scale;

  // enough samples that the disc is covered rather than dithered
  const cap = quality ? 256 : 64;
  const n = Math.max(12, Math.min(cap, Math.ceil(Math.PI * cocPass * cocPass / 2.0)));
  const lod = Math.max(0, Math.log2(Math.max(1, viewW / bw)));

  ensureBlurTarget(bw, bh);

  // pass 1 — bokeh, in linear light, into a float target
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texBlur, 0);
  gl.viewport(0, 0, bw, bh);

  gl.useProgram(progBokeh);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texImg);
  gl.uniform1i(u(progBokeh, 'uImg'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texDepth);
  gl.uniform1i(u(progBokeh, 'uDepth'), 1);
  gl.uniform2f(u(progBokeh, 'uRes'), bw, bh);
  gl.uniform1f(u(progBokeh, 'uFocus'), val('focus'));
  gl.uniform1f(u(progBokeh, 'uSpread'), val('spread'));
  gl.uniform1f(u(progBokeh, 'uMaxCoC'), cocPass);
  gl.uniform1f(u(progBokeh, 'uEdge'), val('edge'));
  gl.uniform1f(u(progBokeh, 'uHiThresh'), Math.pow(val('hthresh'), 2.2)); // slider is in display terms
  gl.uniform1f(u(progBokeh, 'uHiBoost'), val('hboost'));
  gl.uniform1f(u(progBokeh, 'uPx'), Math.max(ref * scale, 0.001));
  gl.uniform1f(u(progBokeh, 'uLod'), lod);
  gl.uniform1i(u(progBokeh, 'uSamples'), n);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // pass 2 — composite against the untouched source, then glass and sensor
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(progFinish);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texImg);
  gl.uniform1i(u(progFinish, 'uImg'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texDepth);
  gl.uniform1i(u(progFinish, 'uDepth'), 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texBlur);
  gl.uniform1i(u(progFinish, 'uBlur'), 2);
  gl.uniform2f(u(progFinish, 'uRes'), w, h);
  gl.uniform1f(u(progFinish, 'uFocus'), val('focus'));
  gl.uniform1f(u(progFinish, 'uSpread'), val('spread'));
  gl.uniform1f(u(progFinish, 'uMaxCoC'), maxCoC);
  gl.uniform1f(u(progFinish, 'uEdge'), val('edge'));
  gl.uniform1f(u(progFinish, 'uCA'), val('ca'));
  gl.uniform1f(u(progFinish, 'uDist'), val('dist'));
  gl.uniform1f(u(progFinish, 'uVig'), val('vig'));
  gl.uniform1f(u(progFinish, 'uGrain'), val('grain'));
  gl.uniform1f(u(progFinish, 'uLift'), val('lift'));
  gl.uniform1f(u(progFinish, 'uSeed'), 17.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------------------------- layout ---------------------------- */

// Draw at the size the canvas is actually displayed at. Handing the compositor
// a 3400px buffer to squeeze into a 700px box is what made the preview mushy.
function layout(){
  if(!imgCanvas) return;
  const availW = Math.max(64, stage.clientWidth  - 28);
  const availH = Math.max(64, stage.clientHeight - 28);
  const fit = Math.min(availW / imgCanvas.width, availH / imgCanvas.height, 1);
  const cssW = Math.max(1, Math.round(imgCanvas.width  * fit));
  const cssH = Math.max(1, Math.round(imgCanvas.height * fit));
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';

  const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
  const back = Math.min(dpr, imgCanvas.width / cssW);   // never render above native
  const bw = Math.max(1, Math.round(cssW * back));
  const bh = Math.max(1, Math.round(cssH * back));
  if(canvas.width !== bw || canvas.height !== bh){ canvas.width = bw; canvas.height = bh; }
  updateMeta(bw, bh);
}

function updateMeta(bw, bh){
  if(!imgCanvas){ metaEl.textContent = ''; return; }
  metaEl.textContent =
    'Source ' + imgCanvas.width + '×' + imgCanvas.height +
    ' · preview ' + bw + '×' + bh +
    ' · saves at full size' + (hdr ? '' : ' · 8-bit path');
}

if(window.ResizeObserver){
  new ResizeObserver(() => { layout(); render(); }).observe(stage);
}else{
  window.addEventListener('resize', () => { layout(); render(); });
}

/* ---------------------------- loading ---------------------------- */

function decode(file){
  const url = URL.createObjectURL(file);
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload  = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    im.src = url;
  });
}

// A high-quality drawImage handles moderate reductions well on its own; only
// step down in halves once the jump is big enough that a browser with a weaker
// filter would start dropping the pixels it walks past.
function fitToCanvas(src, w, h){
  let cur = src, cw = src.width, ch = src.height;
  while(cw >= w * 4 && ch >= h * 4 && cw > 2 && ch > 2){
    const t = document.createElement('canvas');
    t.width  = Math.max(1, Math.round(cw / 2));
    t.height = Math.max(1, Math.round(ch / 2));
    const x = t.getContext('2d');
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    x.drawImage(cur, 0, 0, t.width, t.height);
    cur = t; cw = t.width; ch = t.height;
  }
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const x = out.getContext('2d');
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.drawImage(cur, 0, 0, w, h);
  return out;
}

async function loadFile(file){
  if(!file || !file.type.startsWith('image/') || !gl) return;
  let im;
  try{ im = await decode(file); }
  catch(e){
    statusEl.textContent = 'That file would not open as an image.';
    statusEl.className = 'warn';
    return;
  }

  const scale = Math.min(1, MAX_SIDE / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.max(1, Math.round(im.naturalWidth  * scale));
  const h = Math.max(1, Math.round(im.naturalHeight * scale));

  imgCanvas = scale < 1 ? fitToCanvas(im, w, h) : (() => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(im, 0, 0);
    return c;
  })();
  img = im;
  autoDepthCanvas = null;

  viewW = viewH = 0; viewCache = null; viewCacheW = viewCacheH = 0;

  $('#drop').classList.add('hide');
  $('#save').disabled = false;
  focusPt = {x:0.5, y:0.5};
  layout();
  if(mode === 'auto') runAutoDepth(); else { rebuildDepth(); render(); }
}

/* ---------------------------- auto depth ---------------------------- */

const MODELS = ['onnx-community/depth-anything-v2-small', 'Xenova/depth-anything-small-hf'];
let pipePromise = null;

async function getPipeline(){
  if(pipePromise) return pipePromise;
  pipePromise = (async () => {
    const mod = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
    mod.env.allowLocalModels = false;
    let lastErr;
    for(const id of MODELS){
      try { return await mod.pipeline('depth-estimation', id, {dtype:'q8'}); }
      catch(e){ lastErr = e; }
    }
    throw lastErr;
  })();
  return pipePromise;
}

async function runAutoDepth(){
  if(!imgCanvas) return;
  if(autoDepthCanvas){ rebuildDepth(); render(); return; }
  statusEl.className = '';
  statusEl.textContent = 'Reading depth — first run downloads the model (~50 MB)…';
  try{
    const pipe = await getPipeline();
    statusEl.textContent = 'Reading depth…';
    // the model works at its own small resolution; feed it a clean downscale
    // rather than a JPEG of the full-size picture
    const s = Math.min(1, 1024 / Math.max(imgCanvas.width, imgCanvas.height));
    const feed = s < 1
      ? fitToCanvas(imgCanvas, Math.round(imgCanvas.width * s), Math.round(imgCanvas.height * s))
      : imgCanvas;
    const out = await pipe(feed.toDataURL('image/png'));
    const d = out.depth;
    const c = document.createElement('canvas');
    c.width = d.width; c.height = d.height;
    const id = c.getContext('2d').createImageData(d.width, d.height);
    const ch = d.channels || 1;
    for(let i = 0; i < d.width * d.height; i++){
      const v = d.data[i * ch];
      id.data[i*4] = id.data[i*4+1] = id.data[i*4+2] = v;
      id.data[i*4+3] = 255;
    }
    c.getContext('2d').putImageData(id, 0, 0);
    autoDepthCanvas = c;
    rebuildDepth();
    // park the focal plane on whatever is closest
    $('#focus').value = 0.92; syncOutputs();
    render();
    statusEl.textContent = 'Depth read. Tap the picture to focus on something.';
  }catch(e){
    console.error(e);
    statusEl.className = 'warn';
    statusEl.textContent = 'Depth model would not load. Subject and Ground still work offline.';
    setMode('radial');
  }
}

/* ---------------------------- ui ---------------------------- */

function setMode(m){
  mode = m;
  document.querySelectorAll('#mode button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  if(m === 'auto'){ runAutoDepth(); return; }
  if(m === 'radial'){ $('#focus').value = 1; statusEl.className=''; statusEl.textContent = 'Tap the picture to set what stays sharp.'; }
  if(m === 'ground'){ $('#focus').value = 0.55; statusEl.className=''; statusEl.textContent = 'Bottom of frame is nearest. Slide the plane to pick a distance.'; }
  syncOutputs(); rebuildDepth(); render();
}

document.querySelectorAll('#mode button').forEach(b =>
  b.addEventListener('click', () => setMode(b.dataset.mode)));

function syncOutputs(){
  document.querySelectorAll('.row').forEach(r => {
    const i = r.querySelector('input'), o = r.querySelector('output');
    if(!i || !o) return;
    const step = i.step.includes('.') ? i.step.split('.')[1].length : 0;
    o.textContent = parseFloat(i.value).toFixed(Math.min(step, 3));
  });
}
document.querySelectorAll('.row input').forEach(i =>
  i.addEventListener('input', () => { syncOutputs(); render(); }));

canvas.addEventListener('click', e => {
  if(!imgCanvas) return;
  const r = canvas.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width;
  const ny = (e.clientY - r.top) / r.height;
  if(mode === 'auto' || mode === 'ground'){
    $('#focus').value = depthValueAt(nx, ny);
    syncOutputs(); render();
  }else{
    focusPt = {x:nx, y:ny};
    rebuildDepth(); render();
  }
});

$('#showdepth').addEventListener('click', e => {
  showDepth = !showDepth;
  e.currentTarget.setAttribute('aria-pressed', String(showDepth));
  e.currentTarget.textContent = showDepth ? 'Show picture' : 'Show depth';
  render();
});

const DEFAULTS = {focus:1, spread:0.42, aperture:22, edge:0, hthresh:0.72, hboost:3.2, ca:0, dist:0, vig:0.16, grain:0.008, lift:0};
$('#reset').addEventListener('click', () => {
  for(const k in DEFAULTS) $('#' + k).value = DEFAULTS[k];
  focusPt = {x:0.5, y:0.5};
  syncOutputs(); rebuildDepth(); render();
});

// Save re-renders the picture at its native size, at full sample count, so the
// file is not a blown-up copy of the on-screen preview.
function exportPNG(){
  const bw = canvas.width, bh = canvas.height;
  const w = imgCanvas.width, h = imgCanvas.height;
  canvas.width = w; canvas.height = h;
  drawScene(w, h, true);

  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  out.getContext('2d').drawImage(canvas, 0, 0);

  canvas.width = bw; canvas.height = bh;
  layout(); render();

  out.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'focal.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}

$('#save').addEventListener('click', () => {
  if(!imgCanvas) return;
  if(showDepth){
    showDepth = false;
    $('#showdepth').setAttribute('aria-pressed','false');
    $('#showdepth').textContent='Show depth';
  }
  statusEl.className = '';
  statusEl.textContent = 'Rendering at full size…';
  requestAnimationFrame(() => {
    exportPNG();
    statusEl.textContent = 'Saved at ' + imgCanvas.width + '×' + imgCanvas.height + '.';
  });
});

$('#pick').addEventListener('click', () => $('#file').click());
$('#pick2').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => loadFile(e.target.files[0]));

['dragenter','dragover'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.style.outline = '1px solid var(--coat-b)'; }));
['dragleave','drop'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.style.outline = 'none'; }));
stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
window.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if(it) loadFile(it.getAsFile());
});

syncOutputs();
</script>
</body>
</html>
